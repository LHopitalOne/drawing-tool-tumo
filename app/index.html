<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scribble</title>
    <link rel="preload" as="image" href="graphics/icons/brush_not-selected.svg">
    <link rel="preload" as="image" href="graphics/icons/brush_selected.svg">
    <link rel="preload" as="image" href="graphics/icons/pen_not-selected.svg">
    <link rel="preload" as="image" href="graphics/icons/pen_selected.svg">
    <link rel="preload" as="image" href="graphics/icons/pencil_not-selected.svg">
    <link rel="preload" as="image" href="graphics/icons/pencil_selected.svg">
    <link rel="preload" as="image" href="graphics/icons/spray_not-selected.svg">
    <link rel="preload" as="image" href="graphics/icons/spray_selected.svg">
    <link rel="preload" as="image" href="graphics/icons/fountain_not-selected.svg">
    <link rel="preload" as="image" href="graphics/icons/fountain_selected.svg">
    <link rel="preload" as="image" href="graphics/icons/eraser_not-selected.svg">
    <link rel="preload" as="image" href="graphics/icons/eraser_selected.svg">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/coming-soon.css">
    <link rel="stylesheet" href="styles/loader.css">
</head>

<body>
    <div class="page-loader">
        <div class="page-loader__content">
            <!-- Phyllotaxis will be inserted here -->
            <div class="page-loader__text">The page is loading. Please wait…</div>
        </div>
    </div>
    <!-- Setup Modal -->
    <div id="setupModal" class="modal">
        <div class="modal-content">
            <h2>Setup</h2>
            <form id="setupForm" novalidate>
                <div class="form-group">
                    <label for="canvasWidth">Canvas Width:</label>
                    <input type="number" id="canvasWidth" value="800" min="1" max="50000" required>
                </div>
                <div class="form-group">
                    <label for="canvasHeight">Canvas Height:</label>
                    <input type="number" id="canvasHeight" value="800" min="1" max="50000" required>
                </div>
                <div class="form-group">
                    <label for="backgroundColor">Background Color:</label>
                    <input type="color" id="backgroundColor" value="#ffffff">
                </div>
                <button id="setupSubmitBtn" type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal error" role="dialog" aria-modal="true" aria-labelledby="errorTitle">
        <div class="modal-content">
            <h2 id="errorTitle">Error</h2>
            <p id="errorMessage" style="margin-bottom:16px;color:#333;"></p>
            <button id="errorCloseBtn" class="submit-btn" type="button">Close</button>
        </div>
    </div>

    <div class="container">
        <div class="settings-bar" role="toolbar" aria-label="Top settings bar">
            <div class="settings-bar-content">
                <div class="left-group" aria-label="Left actions">
                    <div class="toolbar-chip" aria-label="Canvas background color">
                        <button id="canvasBgIndicator" class="chip-circle" type="button"
                            aria-label="Canvas background color"></button>
                    </div>
                    <div class="toolbar-chip" aria-label="Export">
                        <div class="hover-reveal" data-pair="export-only">
                            <button id="saveBtn" class="chip-button" type="button" title="Export" aria-label="Export">
                                <span class="icon" aria-hidden="true">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M10 3V13M10 13L6 9M10 13L14 9M4 17H16" stroke="currentColor"
                                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="toolbar-chip" aria-label="Undo / Redo">
                        <div class="hover-reveal" data-pair="undo-redo">
                            <button id="undoBtn" class="chip-button" type="button" title="Undo" aria-label="Undo">
                                <svg width="18" height="18" viewBox="0 0 47 54" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M3.5 30.5C3.5 29.6716 2.82843 29 2 29C1.17157 29 0.5 29.6716 0.5 30.5H2H3.5ZM8.45312 15.1429L25.7341 16.3119L18.106 0.761578L8.45312 15.1429ZM45 30.5H43.5C43.5 41.5457 34.5457 50.5 23.5 50.5V52V53.5C36.2025 53.5 46.5 43.2025 46.5 30.5H45ZM23.5 52V50.5C12.4543 50.5 3.5 41.5457 3.5 30.5H2H0.5C0.5 43.2025 10.7975 53.5 23.5 53.5V52ZM23.5 9V10.5C34.5457 10.5 43.5 19.4543 43.5 30.5H45H46.5C46.5 17.7975 36.2025 7.5 23.5 7.5V9ZM20.5729 9.19758L20.7752 10.6839C21.6655 10.5627 22.575 10.5 23.5 10.5V9V7.5C22.4393 7.5 21.3946 7.5719 20.3706 7.71129L20.5729 9.19758Z"
                                        fill="currentColor" />
                                </svg>
                            </button>
                            <button id="redoBtn" class="chip-button secondary" type="button" title="Redo"
                                aria-label="Redo">
                                <svg width="18" height="18" viewBox="0 0 47 54" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <g transform="translate(47,0) scale(-1,1)">
                                        <path
                                            d="M3.5 30.5C3.5 29.6716 2.82843 29 2 29C1.17157 29 0.5 29.6716 0.5 30.5H2H3.5ZM8.45312 15.1429L25.7341 16.3119L18.106 0.761578L8.45312 15.1429ZM45 30.5H43.5C43.5 41.5457 34.5457 50.5 23.5 50.5V52V53.5C36.2025 53.5 46.5 43.2025 46.5 30.5H45ZM23.5 52V50.5C12.4543 50.5 3.5 41.5457 3.5 30.5H2H0.5C0.5 43.2025 10.7975 53.5 23.5 53.5V52ZM23.5 9V10.5C34.5457 10.5 43.5 19.4543 43.5 30.5H45H46.5C46.5 17.7975 36.2025 7.5 23.5 7.5V9ZM20.5729 9.19758L20.7752 10.6839C21.6655 10.5627 22.575 10.5 23.5 10.5V9V7.5C22.4393 7.5 21.3946 7.5719 20.3706 7.71129L20.5729 9.19758Z"
                                            fill="currentColor" />
                                    </g>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="toolbar-chip" aria-label="Move to trash">
                        <button id="clearBtn" class="chip-button" type="button" title="Move to trash"
                            aria-label="Move to trash">
                            <span class="icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M5 6H15M8 9V13M12 9V13M7 6V4.5C7 3.67157 7.67157 3 8.5 3H11.5C12.3284 3 13 3.67157 13 4.5V6M4 6H16V16.5C16 17.3284 15.3284 18 14.5 18H5.5C4.67157 18 4 17.3284 4 16.5V6Z"
                                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </span>
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none" />
                </div>
                <div class="right-group" aria-label="Brush and symmetry controls">
                    <div class="toolbar-chip" aria-label="Color picker (pipette)">
                        <button id="pipetteBtn" class="chip-button pipette" type="button" title="Pipette"
                            aria-label="Pipette">
                            <span class="icon" aria-hidden="true">
                                <svg width="23" height="65" viewBox="0 0 23 65" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <g clip-path="url(#clip0_3406_2)">
                                        <path
                                            d="M16.3421 55.2175C16.3421 57.9189 14.1806 60.1089 11.5141 60.1089C8.83672 60.1089 6.67063 57.9015 6.68626 55.1889L6.7424 45.4519L16.3421 35.7029V55.2175Z"
                                            fill="currentColor" />
                                        <path fill-rule="evenodd" clip-rule="evenodd"
                                            d="M6.65813 8.58443C6.65827 5.87531 8.82573 3.67944 11.4997 3.67926C14.1739 3.67926 16.3421 5.87594 16.3421 8.58527L16.3421 56.4157C16.342 58.1811 15.4207 59.7278 14.0392 60.5917L14.0701 62.4844C14.0935 63.9705 12.9813 65 11.5141 65C10.0426 65 8.78744 63.9632 8.81729 62.4726L8.85491 60.5239C7.53229 59.6482 6.65814 58.1351 6.65814 56.4148L6.65813 8.58443ZM11.4997 4.90555C9.49429 4.90573 7.86867 6.55265 7.86853 8.58443L7.86853 56.4148C7.86853 58.4468 9.4949 60.0945 11.5006 60.0945C13.5058 60.0942 15.1315 58.4472 15.1318 56.4157L15.1317 8.58527C15.1317 6.55327 13.5054 4.90555 11.4997 4.90555Z"
                                            fill="currentColor" />
                                        <path
                                            d="M18.1579 19.6227L4.84211 19.6227V6.74532C4.84211 3.01998 7.82296 1.57011e-07 11.5 0C15.1771 -1.57011e-07 18.1579 3.01998 18.1579 6.74531V19.6227Z"
                                            fill="currentColor" />
                                        <path
                                            d="M1.81579 19.6227C0.812957 19.6227 8.75364e-09 20.4464 0 21.4624C-8.75364e-09 22.4784 0.812956 23.302 1.81579 23.302H21.1842C22.187 23.302 23 22.4784 23 21.4624C23 20.4464 22.187 19.6227 21.1842 19.6227H1.81579Z"
                                            fill="currentColor" />
                                    </g>
                                    <defs>
                                        <clipPath id="clip0_3406_2">
                                            <rect width="23" height="65" fill="white" />
                                        </clipPath>
                                    </defs>
                                </svg>

                            </span>
                        </button>
                    </div>
                    <div class="size-control" aria-label="Brush size">
                        <input id="topBrushSize" type="number" min="1" max="400" step="1" value="10" inputmode="numeric"
                            aria-label="Brush size value" />
                    </div>
                    <div class="symmetry-control" aria-label="Symmetry axes">
                        <input id="symmetryTopInput" type="number" min="1" max="64" step="1" value="1"
                            inputmode="numeric" aria-label="Symmetry axes value" />
                    </div>
                    <button id="brushColorIndicator" class="chip-circle" type="button"
                        aria-label="Brush color"></button>
                </div>
            </div>
        </div>
        <div class="drawing-area">
            <canvas id="drawingCanvas" width="600" height="600"></canvas>
        </div>
    </div>


    <!-- Settings Panel -->
    <div id="settingsPanel" class="settings-panel" role="dialog" aria-modal="false" hidden>
        <div class="settings-body">
            <div class="brush-group" role="toolbar" aria-label="Brushes"></div>
        </div>
    </div>

    <svg style="display:none;">
        <filter id="displacementFilter">
            <feTurbulence type="turbulence" baseFrequency="0.0" />
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="300" />
        </filter>
    </svg>

    <script type="module" src="js/main.js"></script>
</body>

</html>
